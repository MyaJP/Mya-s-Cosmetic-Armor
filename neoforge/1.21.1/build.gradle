plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'jp.mya'
base { archivesName = 'myas_cosmetic_armor-neoforge-1.21.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8' }

neoForge {
    enable {
        version = '21.1.262'
        disableRecompilation = true
    }
}

processResources {
    def p = [version: project.version, mc: '1.21.1', neo_min: '21.1']
    inputs.properties p
    filesMatching('META-INF/neoforge.mods.toml') { expand p }
}

jar { from('LICENSE.txt') }
