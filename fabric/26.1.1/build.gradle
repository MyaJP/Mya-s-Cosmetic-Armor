plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = '1.0.0'
group = 'jp.mya'
base { archivesName = 'myas_cosmetic_armor-fabric-26.1.1' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }

processResources {
    def p = [version: project.version, mc: '26.1.1', java: '25', loader_min: '0.18.4']
    inputs.properties p
    filesMatching('fabric.mod.json') { expand p }
}

jar { from('LICENSE.txt') }
